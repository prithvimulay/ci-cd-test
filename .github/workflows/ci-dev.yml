name: CI - Smoke Tests (Dev)
on:
  pull_request:
    branches: [ "dev" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - name: Run Smoke Tests
        run: npm run test:smoke