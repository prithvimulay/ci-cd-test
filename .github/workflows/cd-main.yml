name: CD - Build and Version Docker Image
on:
  push:
    branches: [ "main" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Version Tag
        # This uses the GitHub Action Run Number to automatically increment (e.g., v0.0.1, v0.0.2)
        run: echo "VERSION=v0.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Docker Image
        # This builds the image and tags it with your automated version
        run: |
          docker build -t my-ip-app:${{ env.VERSION }} .
          docker tag my-ip-app:${{ env.VERSION }} my-ip-app:latest
          
      - name: Verify Image Creation
        # This prints the list of Docker images to the GitHub logs so you can see it worked
        run: docker images